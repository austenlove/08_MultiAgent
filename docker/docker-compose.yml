services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: multiagent-backend:latest
    container_name: multiagent-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      # 인덱스 (Chroma + BM25) — 재빌드 시에도 유지
      - ../backend/data/chroma_db:/app/data/chroma_db
      - ../backend/data/bm25_index.pkl:/app/data/bm25_index.pkl
      # 정적 참고 문서
      - ../backend/data/static:/app/data/static
      # 분석 결과 JSON 영속화 (요구사항 5)
      - ../backend/data/reports:/app/data/reports
      # 에이전트별 시스템 프롬프트 — 컨테이너 재빌드 없이 수정 가능 (요구사항 1)
      - ../backend/prompts:/app/prompts:ro
    restart: unless-stopped
